<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="990" viewBox="0 0 1560 990"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#35d5ff" stroke-width="2"/></marker><style>text{font-family:Arial,sans-serif;fill:#e8f1ff}.head{font-size:36px;font-weight:bold}.sub{font-size:18px;fill:#a8c4e6}.label{font-size:21px;font-weight:bold}.sm{font-size:17px}.tiny{font-size:15px;fill:#c3d4eb}.panel{fill:#12233e;stroke:#4d86ce;stroke-width:2}.inner{fill:#1a3150;stroke:#668cc5;stroke-width:1.5}.flow{stroke:#35d5ff;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#ffbf69;stroke-width:3;stroke-dasharray:12 8;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1560" height="990" fill="#09182e"/><text x="60" y="62" class="head">Dev7e | AWS ECR → Lightsail Docker Compose Deployment</text><text x="60" y="94" class="sub">Two machines · one private image registry · three containers · persistent MongoDB · controlled ingress</text>
<rect class="panel" x="40" y="145" rx="20" width="405" height="555"/><text x="66" y="187" class="label">1  Windows development laptop</text><text x="66" y="220" class="sm">Existing Python Girls That Code image</text><text x="66" y="247" class="tiny">linux/amd64 · python-girls-that-code:1.0</text><rect class="inner" x="64" y="276" rx="12" width="357" height="135"/><text x="83" y="309" class="sm">AWS CLI + IAM user credentials</text><text x="83" y="337" class="tiny">Profile: dev7e-ecr-publisher</text><text x="83" y="366" class="tiny">ECR token → Docker registry login</text><text x="83" y="392" class="tiny">docker tag → docker push</text><rect class="inner" x="64" y="455" rx="12" width="357" height="153"/><text x="83" y="490" class="sm">Remote deployment files</text><text x="83" y="523" class="tiny">docker-compose.yaml</text><text x="83" y="551" class="tiny">.env (ECR image URI)</text><text x="83" y="579" class="tiny">.env.docker (service credentials)</text>
<rect class="panel" x="512" y="145" rx="20" width="440" height="260"/><text x="538" y="187" class="label">2  Amazon ECR · eu-west-1</text><rect class="inner" x="537" y="223" rx="12" width="388" height="129"/><text x="559" y="262" class="sm">Private repository</text><text x="559" y="294" class="tiny">python-girls-that-code:1.0</text><text x="559" y="323" class="tiny">Managed image storage + registry API</text><path class="flow" d="M445 300 L510 300"/><text x="452" y="280" class="tiny">PUSH</text>
<rect class="panel" x="1017" y="145" rx="20" width="500" height="650"/><text x="1043" y="187" class="label">3  AWS Lightsail · Ubuntu 24.04</text><text x="1043" y="215" class="tiny">x86_64 · Docker Engine + Compose · public IPv4</text><rect class="inner" x="1042" y="246" rx="12" width="448" height="86"/><text x="1063" y="278" class="sm">Docker Compose default network</text><text x="1063" y="308" class="tiny">Service-name DNS · health-gated startup</text><rect class="inner" x="1042" y="355" rx="12" width="210" height="128"/><text x="1060" y="386" class="sm">FastAPI app</text><text x="1060" y="414" class="tiny">ECR image · 1.0</text><text x="1060" y="442" class="tiny">host 8001 → 8000</text><rect class="inner" x="1270" y="355" rx="12" width="220" height="128"/><text x="1288" y="386" class="sm">MongoDB</text><text x="1288" y="414" class="tiny">internal 27017 only</text><text x="1288" y="442" class="tiny">health: healthy</text><rect class="inner" x="1042" y="510" rx="12" width="210" height="125"/><text x="1060" y="542" class="sm">Mongo Express</text><text x="1060" y="571" class="tiny">127.0.0.1:8083</text><text x="1060" y="600" class="tiny">→ container 8081</text><rect class="inner" x="1270" y="510" rx="12" width="220" height="125"/><text x="1288" y="542" class="sm">Named volume</text><text x="1288" y="571" class="tiny">chioma-mongo-data</text><text x="1288" y="600" class="tiny">→ /data/db</text><path class="flow" d="M1252 420 L1269 420"/><path class="flow" d="M1252 571 L1269 447"/><path class="flow" d="M1380 482 L1380 508"/><rect class="inner" x="1042" y="670" rx="12" width="448" height="95"/><text x="1063" y="703" class="sm">Lightsail IPv4 firewall</text><text x="1063" y="732" class="tiny">TCP 8001 · source = developer public IP /32</text><path class="flow" d="M953 282 L1016 282"/><text x="954" y="262" class="tiny">PULL</text><path class="dash" d="M445 565 L979 565 L979 300 L1016 300"/><text x="635" y="544" class="tiny">SSH (22) + SCP file transfer</text>
<rect class="panel" x="40" y="742" rx="20" width="912" height="194"/><text x="66" y="786" class="label">4  Browser verification · restricted public access</text><text x="66" y="823" class="sm">Windows browser → Lightsail public IPv4 :8001 → FastAPI :8000</text><text x="66" y="855" class="tiny">UI visibly loaded; Mongo Express web UI not independently tested</text><text x="66" y="887" class="tiny">MongoDB 27017 not exposed; no remote persistence test documented</text><path class="flow" d="M1042 715 L954 715 L954 833"/><text x="60" y="969" class="tiny">Architecture source: verified Dev7e configuration and deployment evidence · No credentials shown</text></svg>